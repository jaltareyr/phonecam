name: Feature request
description: Suggest an improvement or discuss a contribution.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to help implement or test this.
