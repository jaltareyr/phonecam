<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PhoneCam · PC</title><link rel="stylesheet" href="/style.css"></head>
<body data-role="viewer"><main class="desktop-app"><header class="app-header"><div class="brand"><span class="brand-icon">◉</span><div><strong>PhoneCam</strong><small>Windows camera studio</small></div></div><div class="header-actions"><span class="connection-label"><span class="state-dot"></span> Ready to connect</span><button id="fullscreen" type="button" class="secondary">Fullscreen</button><button id="always-on-top" type="button" class="secondary" hidden aria-pressed="false">Stay on top</button><button id="add-camera" type="button">+ Add camera</button></div></header><div class="app-body"><aside class="left-rail" aria-label="Navigation"><button type="button" class="rail-active" data-section="camera">▣<span>Camera</span></button><button type="button" class="rail-item" data-section="connect">⌁<span>Connect</span></button><button type="button" class="rail-item" data-section="settings">⚙<span>Settings</span></button></aside><div class="workspace"><div class="workspace-heading"><div><span class="eyebrow">LIVE CAMERA</span><h1>Camera preview</h1><p>Connect your Android phone, then control the feed here.</p></div></div><div id="streams" class="camera-grid"></div><p class="hint">Ctrl+S snapshot · Ctrl+R record · Ctrl+P pause · Ctrl+Q discard recording · Ctrl+Enter fullscreen</p></div></div><footer class="studio-toolbar"><button id="connection-status" class="toolbar-status" type="button" title="Connect your phone"><span class="toolbar-wifi" aria-hidden="true">◉</span><span class="toolbar-status-text">Waiting for phone</span></button><div class="studio-actions"><button id="toolbar-snapshot" type="button" title="Save snapshot" aria-label="Save snapshot" disabled>📷</button><button id="toolbar-record" type="button" title="Start recording" aria-label="Start recording" disabled><span class="record-glyph">●</span></button><button id="toolbar-settings" type="button" title="Camera settings" aria-label="Camera settings" aria-expanded="false">⚙</button><button id="toolbar-menu" type="button" title="Options" aria-label="Options menu" aria-expanded="false">☰</button></div></footer><nav id="studio-menu" class="studio-menu" aria-label="PhoneCam options" hidden><button type="button" data-action="connect">Connect phone</button><button type="button" data-action="new-camera">Add another camera</button><button type="button" data-action="select-camera">Select camera <span id="camera-count"></span></button><button type="button" data-action="settings">Camera settings</button><button type="button" data-action="open-feed">Open feed window</button><button type="button" data-action="fullscreen">Fullscreen feed</button><button type="button" data-action="on-top" hidden>Stay on top</button><button type="button" data-action="close-menu">Close menu</button></nav><div id="panel-scrim" class="panel-scrim" hidden></div></main><script type="module" src="/viewer.js"></script></body></html>
