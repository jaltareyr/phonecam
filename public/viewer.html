<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PhoneCam · PC</title><link rel="stylesheet" href="/style.css"></head>
<body data-role="viewer"><main class="desktop-app"><header class="app-header"><div class="brand"><span class="brand-icon">◉</span><div><strong>PhoneCam</strong><small>Windows camera studio</small></div></div><div class="header-actions"><span class="connection-label"><span class="state-dot"></span> Ready to connect</span><button id="fullscreen" type="button" class="secondary">Fullscreen</button><button id="always-on-top" type="button" class="secondary" hidden aria-pressed="false">Stay on top</button><button id="add-camera" type="button">+ Add camera</button></div></header><div class="app-body"><aside class="left-rail" aria-label="Navigation"><button type="button" class="rail-active" data-section="camera">▣<span>Camera</span></button><button type="button" class="rail-item" data-section="connect">⌁<span>Connect</span></button><button type="button" class="rail-item" data-section="settings">⚙<span>Settings</span></button></aside><div class="workspace"><div class="workspace-heading"><div><span class="eyebrow">LIVE CAMERA</span><h1>Camera preview</h1><p>Connect your Android phone, then control the feed here.</p></div></div><div id="streams" class="camera-grid"></div><p class="hint">Ctrl+S snapshot · Ctrl+R record · Ctrl+P pause · Ctrl+Q discard recording · Ctrl+Enter fullscreen</p></div></div></main><script type="module" src="/viewer.js"></script></body></html>
