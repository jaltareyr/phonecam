<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PhoneCam · Phone</title><link rel="stylesheet" href="/style.css"></head>
<body data-role="phone"><main><div class="eyebrow">PHONECAM / ANDROID</div><h1>Send your camera</h1><p class="intro">Enter the code shown on your PC, then allow camera access.</p><form id="pair-form" class="card"><label for="pair-code" class="label">Pairing code</label><input id="pair-code" autocomplete="off" inputmode="text" maxlength="6" placeholder="ABC234" required><label for="camera-select" class="label">Camera</label><select id="camera-select"><option value="environment">Back camera</option><option value="user">Front camera</option></select><button type="submit">Start camera</button><p id="status">Ready to pair</p></form><video id="local-video" autoplay muted playsinline></video><div class="hint">Keep this page open while using the camera.</div></main><script type="module" src="/app.js"></script></body></html>
